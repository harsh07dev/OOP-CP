name: macOS Build & Test

on:
  push:
    branches: [ main, Server-side ]
  pull_request:
    branches: [ main, Server-side ]
  workflow_dispatch:

jobs:
  macos-build-and-test:
    name: macOS Build & Regression Tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake sqlite

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build server and client
        run: |
          cmake --build build --config Release --parallel

      - name: Run cross-platform regression test suite
        run: |
          python3 tests/regression_tests.py

      - name: Display server logs on failure
        if: failure()
        run: |
          if [ -f logs/chat.log ]; then
            cat logs/chat.log
          else
            echo "No log file found at logs/chat.log"
          fi
